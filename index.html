# Desafios em dupla: sistema da Byte Burger

Hoje vocês são a equipe de desenvolvimento da **Byte Burger**, uma lanchonete que está montando o próprio sistema. São 4 desafios, e cada um é um pedaço do sistema: o cadastro do cliente, o pedido, o programa de pontos e o fechamento da conta.

Os desafios contam uma história só, mas cada arquivo já traz os dados de que precisa. Se a dupla não terminar um, começa o próximo do zero sem problema.

## Como funciona (programação em par)

A gente vai trabalhar do jeito que muita empresa trabalha: **programação em par**, uma prática do XP (Extreme Programming). São duas pessoas, um computador e um problema.

| Papel         | O que faz                                                                                                              |
| ------------- | ---------------------------------------------------------------------------------------------------------------------- |
| **Piloto**    | Fica no teclado e escreve o código. Fala em voz alta o que está fazendo.                                               |
| **Navegador** | Não toca no teclado. Lê o enunciado, pensa no próximo passo, procura erro de digitação e consulta o `index.ts` e o guia. |

Regras da dupla:

- Cada desafio tem **30 minutos**. Aos **15 minutos** o professor avisa e vocês **trocam de papel**: quem era piloto vira navegador e o contrário.
- O navegador não pega o teclado nem "dita letra por letra". Ele diz **o que** fazer ("agora tira os espaços do nome"), e o piloto decide **como** escrever.
- Fez uma tarefa? Roda. Deu certo? Próxima. Não deixa para testar tudo no final.
- Travou? Primeiro a dupla conversa e olha o `index.ts` e o `GUIA-DE-ESTUDOS.md`. Só depois chama o professor.
- Acabou o tempo, parou. Roda a correção, vê a nota e vai para o próximo desafio.

## Cronograma (2 horas)

| Horário     | Desafio                                   | Assunto                                           |
| ----------- | ----------------------------------------- | ------------------------------------------------- |
| 0:00 – 0:30 | [1. Cadastro do cliente](#desafio-1-cadastro-do-cliente) | variáveis, constantes, tipos e strings            |
| 0:30 – 1:00 | [2. Montando o pedido](#desafio-2-montando-o-pedido)     | números, `Math` e operadores aritméticos          |
| 1:00 – 1:30 | [3. Programa de pontos](#desafio-3-programa-de-pontos)   | operadores de atribuição, relacionais e lógicos   |
| 1:30 – 2:00 | [4. Fechando a conta](#desafio-4-fechando-a-conta)       | condicional simples (`if`) juntando tudo          |

Cada desafio tem 5 tarefas de 2 pontos: **10 pontos por desafio**.

## Antes de começar

- Cada desafio tem um arquivo: `desafio-1.ts`, `desafio-2.ts`, `desafio-3.ts` e `desafio-4.ts`. Dentro dele tem um comentário para cada tarefa (`// TAREFA 1`, `// TAREFA 2`...). Escreve a resposta **embaixo do comentário dela**.
- Para rodar o desafio 1, por exemplo:

  ```bash
  tsx ~/CURSO-TS-CETAM/desafio-1.ts
  ```

- Para ver a nota do desafio 1 (troca o `1` pelo número do desafio):

  ```bash
  tsx ~/CURSO-TS-CETAM/desafios.spec.ts 1
  ```

- Quando a tarefa mandar criar alguma coisa, ela diz se é com `let` ou com `const`, e qual nome usar. Use **exatamente** esse nome.
- Quando a tarefa pedir para "mostrar", é com `console.log`.
- Nos desafios 3 e 4 o arquivo já começa com um bloco `// DADOS DO SISTEMA (nao mexa)`. Não mude nada ali.
- Valor que dá para calcular **não se digita direto**. Se a tarefa pede o total, o total sai de uma conta, não de você escrever `93.28`.

## Desafio 2. Montando o pedido

A Maria pediu 2 hambúrgueres, 1 batata e 3 refrigerantes. Ela vai dividir a conta com 2 amigos e pagar com uma nota de 100.

| `PRECO_BATATA`    | `number` | `12.5`   |
| `precoRefriTexto` | `string` | `"7.5"`  |

O preço do refri veio do cardápio digital como **texto**. Vamos ter que converter.

Crie com `const`, **sem escrever o tipo**: `qtdBurger` valendo `2`, `qtdBatata` valendo `1` e `qtdRefri` valendo `3`.

| `totalBurger`    | preço do hambúrguer vezes a quantidade                  |
| `totalBatata`    | preço da batata vezes a quantidade                      |
| `totalRefri`     | preço do refri vezes a quantidade                       |
| `subtotal`       | a soma dos três totais                                  |

### Tarefa 3. Taxa de serviço (2 pts)

Crie com `const`:

| Crie com `const`  | Com o quê                                                    |
| ----------------- | ------------------------------------------------------------ |

| `total`           | `subtotal` mais `taxa`                                       |

Mostre `itemMaisCaro`, `itemMaisBarato` e `totalTexto`. O `totalTexto` tem que dar `"93.28"`.

São 3 pessoas. Ninguém quer mexer com centavo, então cada um paga o valor arredondado **para cima**, e o que sobrar fica de gorjeta.

## Desafio 3. Programa de pontos

A Byte Burger tem um programa de fidelidade. A cada pedido o cliente ganha pontos, e com pontos ganha vantagens.

Arquivo: `desafio-3.ts`. Ele já começa com os dados do pedido da Maria. **Não mexa neles.**

### Tarefa 1. Somando os pontos (2 pts)

Crie com `let` a `pontos` valendo `120` (o que a Maria já tinha). Depois, **sem criar outra variável e usando os operadores de atribuição curtos** (`+=`, `-=`, `*=`):

1. some em `pontos` o `totalPedido` arredondado para baixo (cada real vale 1 ponto)
2. hoje é dia de pontos em dobro: multiplique `pontos` por 2
3. a Maria trocou 150 pontos por um milk-shake: tire 150 de `pontos`

Mostre `pontos` depois de cada passo. No fim tem que dar `276`.

### Tarefa 2. Contadores (2 pts)

| Crie com `let`  | Valor |
| --------------- | ----- |
| `visitas`       | `9`   |
| `estoqueBurger` | `50`  |

- A Maria acabou de visitar a loja: some 1 em `visitas` usando `++`.
- Saíram os 2 hambúrgueres do pedido: tire `qtdBurger` de `estoqueBurger` usando `-=`.
- Um hambúrguer caiu no chão: tire 1 de `estoqueBurger` usando `--`.

Mostre `visitas` e `estoqueBurger`.

### Tarefa 3. Fazendo perguntas (2 pts)

Crie com `const`. Cada uma tem que sair de uma **comparação**, nada de escrever `true` ou `false` direto:

| Crie com `const` | É `true` quando...                                  |
| ---------------- | --------------------------------------------------- |
| `ehVip`          | `pontos` é maior ou igual a 250                     |
| `pedidoGrande`   | `qtdItens` é maior que 5                            |
| `cupomValido`    | `cupom` é igual a `"BYTE10"` (valor **e** tipo)     |
| `ehMenor`        | `idadeCliente` é menor que 18                       |
| `diaPromocao`    | `diaDaSemana` é igual a `"sexta"` (valor **e** tipo)|

Mostre as cinco. Embaixo, num comentário, explique a diferença entre `==` e `===`, e qual a gente prefere usar.

### Tarefa 4. As regras da loja (2 pts)

Crie com `const`, usando as variáveis da tarefa 3 e os operadores lógicos (`&&`, `||`, `!`):

| Crie com `const`     | Regra                                                         |
| -------------------- | ------------------------------------------------------------- |

Mostre as quatro. Antes de rodar, a dupla deve combinar em voz alta o que espera que apareça.

### Tarefa 5. Painel do cliente (2 pts)

## Desafio 4. Fechando a conta

Hora de fechar a conta da Maria, que pediu por delivery. Cada regra da loja só vale **se** uma condição for verdadeira: é aqui que entra o `if`.

Arquivo: `desafio-4.ts`. Ele já começa com os dados do pedido. **Não mexa neles.**

Regra deste desafio: valor que depende de uma regra **só muda dentro de um `if`**. Não vale escrever `desconto = 17` direto.

### Tarefa 1. Começando a conta (2 pts)

| -------------- | ----- |
| `desconto`     | `0`   |
| `taxaEntrega`  | `8`   |
| `brindes`      | `0`   |

Depois, com um `if`: se `ehVip` for verdadeiro, mostre `"Cliente VIP no pedido!"`.

### Tarefa 2. Descontos (2 pts)

Um `if` para cada regra:

- se `cupom` for igual a `"BYTE10"`, some 10 em `desconto`
- se `ehVip` for verdadeiro **e** `subtotal` for maior que 50, some 5 em `desconto`
- se `pagouComPix` for verdadeiro, some 2 em `desconto`

Mostre `desconto`.

### Tarefa 3. Taxa de entrega (2 pts)

- se `distanciaKm` for maior que 5, some 4 em `taxaEntrega` (é longe)
- se `subtotal` for maior ou igual a 100 **ou** for `aniversario`, a entrega é grátis: `taxaEntrega` passa a ser 0

Mostre `taxaEntrega`. Antes de rodar, combine com a dupla: a entrega vai sair grátis ou não? Por quê?

### Tarefa 4. Total e brindes (2 pts)

Crie com `const` o `total`: `subtotal` menos `desconto` mais `taxaEntrega`. Mostre `total`.

Depois, um `if` para cada regra, usando `++` ou `+=`:

- se `total` for maior que 50, ganha 1 brinde
- se `ehVip` for verdadeiro, ganha 1 brinde
- se for `aniversario`, ganha 3 brindes

Mostre `brindes`.

### Tarefa 5. Avisos e comprovante (2 pts)

- se `horaPedido` for maior ou igual a 22, mostre `"Atencao: a cozinha fecha as 23h"`
- se `pagouComPix` **não** for verdadeiro, mostre `"Pagamento na entrega"`

Com o pedido de hoje, só o primeiro aviso aparece. O segundo `if` tem que estar no código mesmo assim.

    // ABAS: o desafios.md e quebrado nos titulos "## " (Como funciona + Desafio 1..4)
    const md = document.getElementById("desafios-md").textContent.trim()
    const blocos = md.split(/^## /m)
    const abertura = blocos.shift()
    const desafios = blocos.filter((b) => b.startsWith("Desafio"))
    const geral = blocos.filter((b) => !b.startsWith("Desafio"))
    const abas = [
      { nome: "Como funciona", texto: abertura + geral.map((b) => "## " + b).join("\n") },
      ...desafios.map((b) => ({ nome: b.split("\n")[0].replace(/^Desafio (\d)\./, "Desafio $1 ·"), texto: "## " + b })),
    ]

    let abaAtual = 0
    const navAbas = document.getElementById("abas")
    const conteudo = document.getElementById("conteudo")

    function mostrarAba(i) {
      abaAtual = (i + abas.length) % abas.length
      conteudo.innerHTML = marked.parse(abas[abaAtual].texto.replace(/^---\s*$/gm, ""))
      navAbas.innerHTML = abas.map((a, j) =>
        `<button data-aba="${j}" class="whitespace-nowrap px-3 py-2 text-sm border-b-2 ${j === abaAtual ? "border-amber-400 text-amber-300" : "border-transparent text-zinc-400 hover:text-zinc-200"}">${a.nome}</button>`
      ).join("")
      window.scrollTo({ top: 0 })
    }

    navAbas.addEventListener("click", (e) => {
      const botao = e.target.closest("[data-aba]")
      if (botao) mostrarAba(Number(botao.dataset.aba))
    })

    // links do cronograma (#desafio-2-...) abrem a aba do desafio
    conteudo.addEventListener("click", (e) => {
      const link = e.target.closest('a[href^="#desafio-"]')
      if (!link) return
      e.preventDefault()
      mostrarAba(Number(link.getAttribute("href").match(/#desafio-(\d)/)[1]))
    })

    // SOM: bips gerados na hora com Web Audio (nao precisa de arquivo)
    let audio = null
    let somLigado = true

    function bip(freq = 880, duracao = 0.12, volume = 0.25) {
      if (!somLigado) return
      audio ??= new AudioContext()
      const osc = audio.createOscillator()
      const ganho = audio.createGain()
      osc.type = "square"
      osc.frequency.value = freq
      ganho.gain.setValueAtTime(volume, audio.currentTime)
      ganho.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duracao)
      osc.connect(ganho).connect(audio.destination)
      osc.start()
      osc.stop(audio.currentTime + duracao)
    }

    const bipMarco = () => { bip(660, 0.15); setTimeout(() => bip(880, 0.2), 180) }
    const alarme = () => [0, 250, 500, 750].forEach((t) => setTimeout(() => bip(1200, 0.22, 0.35), t))

    // CRONOMETRO
    // o desafio tem 2 turnos iguais (troca de piloto na metade).
    // bip a cada 5 min; no ultimo minuto de cada turno, bip a cada 3 s;
    // nos ultimos 30 s o intervalo vai encurtando ate virar quase um apito continuo.
    const el = (id) => document.getElementById(id)
    let duracao = 30 * 60
    let decorrido = 0
    let rodando = false
    let ultimoInstante = 0
    let proximoBipFinal = Infinity
    let anuncioFeito = { meio: false, fim: false }

    const formatar = (s) => {
      const t = Math.max(0, Math.ceil(s))
      return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`
    }

    function restanteNoTurno() {
      const meio = duracao / 2
      return decorrido < meio ? meio - decorrido : duracao - decorrido
    }

    function desenhar() {
      const turno = decorrido < duracao / 2 ? 1 : 2
      const restante = restanteNoTurno()
      el("tempo").textContent = formatar(restante)
      el("turno").textContent = decorrido >= duracao
        ? "Tempo esgotado"
        : `Turno ${turno} · integrante ${turno === 1 ? "A" : "B"} no teclado`
      el("total").textContent = `Desafio: ${formatar(duracao - decorrido)} restantes`
      el("barra").style.width = `${Math.min(100, (decorrido / duracao) * 100)}%`
      el("play").textContent = rodando ? "❚❚ Pausar" : "▶ Play"
      el("play").className = `rounded-lg px-4 py-2 font-semibold ${rodando ? "bg-amber-600 hover:bg-amber-500" : "bg-emerald-600 hover:bg-emerald-500"}`

      const final = rodando && restante <= 60 && decorrido < duracao
      el("cronometro").classList.toggle("border-red-500", final)
      el("cronometro").classList.toggle("bg-red-950", final)
      el("tempo").classList.toggle("text-red-400", final)
      el("tempo").classList.toggle("piscar", rodando && restante <= 10 && decorrido < duracao)
      el("barra").classList.toggle("bg-red-500", final)
      el("barra").classList.toggle("bg-emerald-500", !final)
    }

    function avisar(titulo, texto) {
      el("aviso-titulo").textContent = titulo
      el("aviso-texto").textContent = texto
      el("aviso").classList.remove("hidden")
    }

    function intervaloFinal(restante) {
      if (restante > 30) return 3
      return Math.max(0.12, (restante / 30) * 1.2)
    }

    function passo(agora) {
      if (!rodando) return
      const antes = decorrido
      decorrido = Math.min(duracao, decorrido + (agora - ultimoInstante) / 1000)
      ultimoInstante = agora

      // bip de marco a cada 5 minutos (fora do fim de turno, que tem alarme proprio)
      const marcoAntes = Math.floor(antes / 300)
      const marcoAgora = Math.floor(decorrido / 300)
      if (marcoAgora > marcoAntes && decorrido % (duracao / 2) > 1 && restanteNoTurno() > 60) bipMarco()

      // contagem final de cada turno, estilo bomba
      const restante = restanteNoTurno()
      if (restante <= 60 && restante > 0) {
        if (proximoBipFinal === Infinity) proximoBipFinal = decorrido
        if (decorrido >= proximoBipFinal) {
          bip(restante <= 30 ? 1400 : 1000, 0.08)
          proximoBipFinal = decorrido + intervaloFinal(restante)
        }
      }

      if (!anuncioFeito.meio && decorrido >= duracao / 2) {
        anuncioFeito.meio = true
        proximoBipFinal = Infinity
        alarme()
        avisar("TROCA!", "Quem estava no teclado vira navegador. Quem navegava assume o teclado. O tempo continua correndo.")
      }
      if (!anuncioFeito.fim && decorrido >= duracao) {
        anuncioFeito.fim = true
        rodando = false
        alarme()
        setTimeout(alarme, 1100)
        avisar("TEMPO!", "Mãos fora do teclado. Rodem a correção: tsx ~/CURSO-TS-CETAM/desafios.spec.ts <número do desafio>")
      }

      desenhar()
      if (rodando) requestAnimationFrame(passo)
    }

    function playPause() {
      if (decorrido >= duracao) return
      rodando = !rodando
      if (rodando) {
        bip(0, 0.01, 0.0001) // destrava o som do navegador no primeiro clique
        ultimoInstante = performance.now()
        requestAnimationFrame(passo)
      }
      desenhar()
    }

    function zerar() {
      rodando = false
      decorrido = 0
      proximoBipFinal = Infinity
      anuncioFeito = { meio: false, fim: false }
      desenhar()
    }

    function pularParaTroca() {
      const alvo = decorrido < duracao / 2 ? duracao / 2 - 3 : duracao - 3
      decorrido = Math.max(decorrido, alvo)
      proximoBipFinal = decorrido
      desenhar()
    }

    function alternarSom() {
      somLigado = !somLigado
      el("som").textContent = somLigado ? "🔊" : "🔇"
    }

    el("play").addEventListener("click", playPause)
    el("zerar").addEventListener("click", zerar)
    el("pular").addEventListener("click", pularParaTroca)
    el("som").addEventListener("click", alternarSom)
    el("aviso-ok").addEventListener("click", () => el("aviso").classList.add("hidden"))
    el("minutos").addEventListener("change", (e) => {
      const minutos = Math.min(120, Math.max(2, Number(e.target.value) || 30))
      e.target.value = minutos
      duracao = minutos * 60
      zerar()
    })

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return
      if (e.code === "Space") { e.preventDefault(); playPause() }
      if (e.key === "r" || e.key === "R") zerar()
      if (e.key === "m" || e.key === "M") alternarSom()
      if (e.key === "ArrowRight") mostrarAba(abaAtual + 1)
      if (e.key === "ArrowLeft") mostrarAba(abaAtual - 1)
      if (e.key === "Escape") el("aviso").classList.add("hidden")
    })

    mostrarAba(0)
    desenhar()
  </script>
</body>
</html>
